<details class="advanced-options remote-metadata-lookup">
  <summary>Find folders and saved credentials</summary>
  <label>Search the complete index<input type="search" data-library-index-query data-unsaved-ignore maxlength="200" autocomplete="off" placeholder="Folder, credential or username"></label>
  <nav aria-label="Folder and credential pages"><div class="button-row">
    <button type="button" class="secondary compact" data-library-index-previous>Previous index page</button>
    <span data-library-index-page></span>
    <button type="button" class="secondary compact" data-library-index-next>Next index page</button>
  </div></nav>
  <p class="field-note" data-library-index-status role="status" aria-live="polite"></p>
</details>
